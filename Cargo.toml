[package]
name = "nekohazard"
version = "0.1.0"
edition = "2024"

[lib]
name = "nekohazard_android"
crate-type = ["lib", "cdylib"]

[dependencies]
anyhow = "1.0.102"
ash = "0.38.0"
ash-window = "0.13.0"
gpu-allocator = "0.28.0"
offset-allocator = "0.2.0"
glam = "0.32.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "registry"] }
winit = "0.30.13"
image = "0.25.10"
noise = "0.9.0"
rayon = "1.11.0"
crossbeam-channel = "0.5.15"
parking_lot = "0.12.5"
shaderc = "0.10.1"
gltf = {version = "1.4.1", features = ["extras", "names", "import"]}
bevy_ecs = "0.20.0"
egui = "0.36.2"
egui-ash-renderer = { version = "0.13.0", features = ["gpu-allocator"] }
egui-winit = "0.36.2"
bytemuck = "1.25.2"

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"
glob = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.14"
log = "0.4"

[package.metadata.android]
package = "xyz.nekohazard.nekoengine"
apk_name = "Nekohazard"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 36

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
version = 1
required = true